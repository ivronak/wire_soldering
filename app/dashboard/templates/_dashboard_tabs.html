{# Dashboard ke do tab: Overview (paisa / factory / stock) aur Machine board (purana live board) #}
<nav class="shrink-0 flex gap-1 border-b border-slate-200" aria-label="Dashboard views">
  {% for key, label in [('overview', 'Overview'), ('board', 'Machine board')] %}
  <a href="{{ url_for('dashboard.dashboard_page') if key == 'overview' else url_for('dashboard.dashboard_page', tab=key) }}"
     class="px-4 py-2 -mb-px text-[13.5px] font-semibold border-b-2 {{ 'border-accent text-accent' if tab == key else 'border-transparent text-ink-faint hover:text-ink' }}"
     {% if tab == key %}aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>

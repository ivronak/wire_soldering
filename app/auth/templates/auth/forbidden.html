{% extends "base.html" %}
{% block title %}No access · Nrupex ERP{% endblock %}
{% block content %}
<div class="max-w-lg mt-6 bg-white border border-slate-300 rounded-lg shadow-sm p-6">
  <div class="w-10 h-10 rounded-full bg-stop-bg border border-stop-border text-stop flex items-center justify-center mb-3">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4"/></svg>
  </div>
  <h1 class="text-[19px] font-bold text-ink">No access</h1>
  <p class="text-[14px] text-ink-muted mt-1">{{ message }}</p>
  {% if first_page_url %}
  <a href="{{ first_page_url }}" class="inline-flex mt-4 px-4 py-2.5 text-[13.5px] font-semibold bg-accent text-white rounded border border-accent-dark hover:bg-accent-dark shadow-sm">Go to my first page</a>
  {% endif %}
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>{% block title %}Nrupex ERP{% endblock %}</title>
  {# Sidebar-rahit simple layout: login / password change / server error pages. Koi DB query nahi, stock alert nahi. #}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Colour theme (Nrupex logo se): tokens + CSS variables ek hi file me — app/static/js/theme.js. Tailwind CDN ke BAAD load hona zaroori hai. -->
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <!-- Shared UI rules (focus ring, checkbox/radio colour) — base.html jaisa hi, taaki login / error pages par bhi keyboard focus dikhe -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/erp-ui.css') }}" />
  <style>
    body { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; font-size: 14.5px; color: var(--ink); background: var(--mist); margin: 0; }
  </style>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body class="antialiased">
  <main class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      {# Brand: Nrupex ka logo (wordmark) + caption #}
      <div class="flex flex-col items-center mb-5 leading-tight">
        <img src="{{ url_for('static', filename='img/nrupex_logo.png') }}" alt="Nrupex" class="block h-20 w-auto mix-blend-multiply" width="213" height="80" />
        <div class="mt-0.5 text-[12px] text-ink-faint tracking-wide">Wire Soldering · Factory ERP</div>
      </div>
      <div class="bg-white border border-slate-300 rounded-lg shadow-sm p-6">
        {% block card %}{% endblock %}
      </div>
    </div>
  </main>
</body>
</html>
